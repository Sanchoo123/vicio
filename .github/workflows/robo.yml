name: Robô de drops

on:
  schedule:
    - cron: "7,37 * * * *"   # reserva: o GitHub salta muitas destas; quem mantém o ritmo é o trabalho "seguinte"
  workflow_dispatch:          # botão "Run workflow" (e o "Procurar agora" da app)
    inputs:
      teste:
        description: "Mandar um aviso de teste para a app"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write              # para o trabalho "seguinte" marcar a ronda seguinte

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:              # uma ronda de cada vez (os lembretes, abaixo, correm à parte)
      group: robo
      cancel-in-progress: false
    outputs:
      timed: ${{ steps.robo.outputs.timed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar o envio de notificações para a app
        run: pip install -q pywebpush==2.5.0

      - name: Testes
        run: python -m unittest -q tests.test_robot

      - name: Correr o robô
        id: robo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_BOX_KEY: ${{ secrets.PUSH_BOX_KEY }}
          VICIO_TESTE: ${{ inputs.teste }}
          TIMED_FILE: ${{ runner.temp }}/timed.json
        run: |
          python -m robot.run
          echo "timed=$(cat "$TIMED_FILE" 2>/dev/null || echo '[]')" >> "$GITHUB_OUTPUT"

      - name: Guardar dados novos
        run: |
          git config user.name "vicio-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "robô: atualizar drops"
          git pull --rebase --autostash
          git push

  # Lembretes de 1 h e 10 min que caem antes da próxima ronda: espera pela hora exata e manda.
  lembretes:
    needs: correr
    if: needs.correr.outputs.timed != '' && needs.correr.outputs.timed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -q pywebpush==2.5.0

      - name: Mandar à hora certa
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_BOX_KEY: ${{ secrets.PUSH_BOX_KEY }}
          TIMED: ${{ needs.correr.outputs.timed }}
        run: |
          printf '%s' "$TIMED" > "$RUNNER_TEMP/timed.json"
          python -m robot.timed "$RUNNER_TEMP/timed.json"

  # Marca a ronda seguinte: espera pela próxima hora certa (:07 ou :37) e põe o robô a correr outra vez.
  # Só a ronda mais recente o faz; se entretanto começou outra (agendada ou da app), esta sai sem fazer nada,
  # para nunca haver duas cadeias de rondas ao mesmo tempo.
  seguinte:
    needs: correr
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Esperar pela próxima ronda
        run: |
          python3 - <<'PY'
          import datetime as dt, time
          now = dt.datetime.now(dt.timezone.utc)
          t = now.replace(second=0, microsecond=0)
          while not (t.minute % 30 == 7 and t - now > dt.timedelta(minutes=3)):
              t += dt.timedelta(minutes=1)
          print("próxima ronda às", t.strftime("%H:%M"), "UTC")
          time.sleep((t - now).total_seconds())
          PY
      - name: Pôr a ronda seguinte a correr
        run: |
          newest=$(gh api "repos/$REPO/actions/workflows/robo.yml/runs?per_page=1" --jq '.workflow_runs[0].id')
          if [ "$newest" != "${{ github.run_id }}" ]; then echo "Já começou outra ronda ($newest): é ela que marca a seguinte."; exit 0; fi
          gh workflow run robo.yml -R "$REPO"
          echo "Ronda seguinte marcada."
